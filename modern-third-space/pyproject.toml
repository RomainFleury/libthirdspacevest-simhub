[project]
name = "modern-third-space"
version = "0.1.0"
description = "Modern Python bridge APIs for the Third Space Vest"
readme = "README.md"
authors = [
  { name = "SimHub Contributors", email = "contact@simhub.dev" }
]
requires-python = ">=3.14"
dependencies = [
  "pyusb>=1.2.1",
  "mss>=9.0.1",
  "bettercam>=1.0.0",
  "pyserial>=3.5",
  "pynput>=1.7.6",
  "winrt-runtime~=3.2",
  "winrt-Windows.Foundation~=3.2",
  "winrt-Windows.Foundation.Collections~=3.2",
  "winrt-Windows.Globalization~=3.2",
  "winrt-Windows.Graphics.Imaging~=3.2",
  "winrt-Windows.Media.Ocr~=3.2",
  "winrt-Windows.Security.Cryptography~=3.2",
  "winrt-Windows.Storage.Streams~=3.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pillow>=10.0.0",
]
ocr-rapid = [
  "rapidocr>=3.0",
  "onnxruntime>=1.17",
]
ocr-tesseract = [
  "pytesseract>=0.3.10",
]
ocr-cv = [
  "opencv-python-headless>=4.8,<5",
]
ocr-all = [
  "rapidocr>=3.0",
  "onnxruntime>=1.17",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.8,<5",
]

[project.scripts]
modern-third-space = "modern_third_space.cli:main"
modern-third-space-relay = "modern_third_space.relay_cli:main"

[tool.setuptools.packages.find]
where = ["src"]


